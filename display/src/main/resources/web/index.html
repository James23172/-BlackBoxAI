<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多机器人协同巡检仿真系统</title>
    <style>
        /* ==================== DESIGN TOKENS ==================== */
        :root {
            --bg-root: #060b16;
            --bg-card: #0d1524;
            --bg-surface: #111b2e;
            --bg-input: #0a1222;
            --text-primary: #edf2f9;
            --text-secondary: #8b9cc0;
            --text-muted: #55657e;
            --accent: #38bdf8;
            --accent-2: #818cf8;
            --accent-3: #c084fc;
            --success: #34d399;
            --warning: #f59e0b;
            --danger: #f87171;
            --border: #1a2744;
            --border-active: #2a3a5c;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-card: 0 4px 24px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
            --shadow-glow: 0 0 24px rgba(56,189,248,0.12);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
        }

        /* ==================== RESET & BASE ==================== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            background: var(--bg-root);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 24px 32px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56,189,248,0.06), transparent),
                radial-gradient(ellipse 40% 40% at 80% 80%, rgba(129,140,248,0.04), transparent);
        }

        /* Subtle grid pattern overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(56,189,248,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56,189,248,0.015) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse 60% 60% at 50% 30%, black 30%, transparent 70%);
        }

        /* ==================== HEADER ==================== */
        .header {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 45%, var(--accent-3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        .header .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 14px;
        }
        .connection-status {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.6px;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.35s ease;
            text-transform: uppercase;
        }
        .connection-status::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
            box-shadow: 0 0 8px currentColor;
        }
        .connected {
            background: rgba(52,211,153,0.1);
            color: var(--success);
            border: 1px solid rgba(52,211,153,0.25);
            box-shadow: 0 0 12px rgba(52,211,153,0.08);
        }
        .disconnected {
            background: rgba(248,113,113,0.1);
            color: var(--danger);
            border: 1px solid rgba(248,113,113,0.25);
            animation: pulse-disconnected 2s ease-in-out infinite;
        }
        @keyframes pulse-disconnected {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        /* ==================== MAIN LAYOUT ==================== */
        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ==================== CANVAS CARD ==================== */
        .canvas-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            padding: 16px;
            box-shadow: var(--shadow-card), var(--shadow-glow);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .canvas-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56,189,248,0.3), transparent);
        }
        #gridCanvas {
            display: block;
            border-radius: var(--radius-md);
            image-rendering: auto;
            cursor: crosshair;
            transition: box-shadow var(--transition);
            max-width: 100%;
            height: auto;
        }

        /* ==================== CONTROL PANEL ==================== */
        .control-panel {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            width: 310px;
            flex-shrink: 0;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            position: relative;
        }
        .control-panel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56,189,248,0.2), transparent);
        }

        /* Section */
        .panel-section {
            padding: 18px 20px;
        }
        .panel-section + .panel-section {
            border-top: 1px solid var(--border);
        }
        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Form rows */
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .form-row:last-child { margin-bottom: 0; }
        .form-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-field label {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .form-field input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            transition: all var(--transition);
            outline: none;
        }
        .form-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56,189,248,0.12);
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: white;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(40%);
        }
        .btn:not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }
        .btn:not(:disabled):active { transform: translateY(0) scale(0.98); }

        .btn-apply  { background: linear-gradient(135deg, #2563eb, #6366f1); }
        .btn-start  { background: linear-gradient(135deg, #059669, #10b981); }
        .btn-pause  { background: linear-gradient(135deg, #d97706, #f59e0b); color: #1a1a1a; }
        .btn-reset  { background: linear-gradient(135deg, #b91c1c, #ef4444); }

        .btn-full { flex: none; width: 100%; }

        /* Toggle */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }
        .toggle-row span {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .toggle-switch {
            position: relative;
            width: 42px;
            height: 24px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--bg-input);
            border-radius: 24px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background: var(--text-secondary);
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        input:checked + .toggle-slider {
            background: var(--accent);
            border-color: var(--accent);
        }
        input:checked + .toggle-slider:before {
            background: white;
            transform: translateX(18px);
        }
        .route-hint {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            padding-top: 6px;
            font-style: italic;
        }

        /* ==================== EXPLORATION PROGRESS ==================== */
        .explore-bar-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .explore-bar-outer {
            flex: 1;
            height: 8px;
            border-radius: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .explore-bar-inner {
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(90deg, #059669, #34d399);
            transition: width 0.5s ease;
            box-shadow: 0 0 8px rgba(52,211,153,0.3);
        }
        .explore-value {
            font-family: var(--font-mono);
            font-size: 15px;
            font-weight: 700;
            color: var(--success);
            min-width: 56px;
            text-align: right;
            transition: all 0.3s ease;
        }
        .task-status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .task-active   { background: rgba(52,211,153,0.12); color: var(--success); }
        .task-inactive { background: rgba(248,113,113,0.10); color: var(--danger); }

        /* ==================== MULTI-CAR TABLE ==================== */
        .car-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }
        .car-table th {
            text-align: left;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .car-table td {
            padding: 6px 2px;
            border-bottom: 1px solid rgba(26,39,68,0.5);
            color: var(--text-secondary);
        }
        .car-table tr:last-child td { border-bottom: none; }
        .car-table .car-name {
            color: var(--text-primary);
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .car-table .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
            box-shadow: 0 0 6px currentColor;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .car-table .car-pos {
            font-family: var(--font-mono);
            font-size: 10px;
            transition: all 0.3s ease;
        }
        .car-table .car-steps {
            font-family: var(--font-mono);
            color: var(--accent);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        /* Selected car highlight */
        .car-table tr.selected {
            background: rgba(56,189,248,0.06);
            border-radius: 4px;
        }
        .car-table tr {
            cursor: pointer;
            transition: background var(--transition);
        }
        .car-table tr:hover {
            background: rgba(56,189,248,0.04);
        }

        /* ==================== COMPLETED BADGE ==================== */
        .completed-badge {
            display: none;
            text-align: center;
            padding: 12px 16px;
            background: linear-gradient(135deg, #059669, #34d399);
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            color: white;
            letter-spacing: 0.5px;
            box-shadow: 0 0 28px rgba(52,211,153,0.3);
            margin-top: 12px;
        }
        .completed-badge.show {
            display: block;
            animation: badge-pop 0.45s ease-out;
        }
        @keyframes badge-pop {
            0% { transform: scale(0.85); opacity: 0; }
            60% { transform: scale(1.03); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ==================== LEGEND ==================== */
        .legend-inline {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
        }
        .legend-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
            box-shadow: 0 0 6px currentColor;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            .control-panel {
                width: 100%;
                max-width: 440px;
            }
            .canvas-card {
                width: 100%;
                max-width: 440px;
            }
            #gridCanvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <div class="header">
        <h1>多机器人协同巡检</h1>
        <div class="subtitle">Multi-Robot Collaborative Inspection Simulator</div>
        <span id="connStatus" class="connection-status disconnected">未连接</span>
    </div>

    <!-- ==================== MAIN ==================== -->
    <div class="main-container">
        <!-- 地图 -->
        <div class="canvas-card">
            <canvas id="gridCanvas" width="600" height="600"></canvas>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <!-- 地图配置 -->
            <div class="panel-section">
                <div class="section-title">地图配置</div>
                <div class="form-row">
                    <div class="form-field">
                        <label>地图宽度</label>
                        <input type="number" id="mapWidth" value="30" min="10" max="80">
                    </div>
                    <div class="form-field">
                        <label>地图高度</label>
                        <input type="number" id="mapHeight" value="30" min="10" max="80">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label>小车数量</label>
                        <input type="number" id="carCount" value="4" min="1" max="20">
                    </div>
                    <div class="form-field">
                        <label>障碍物密度</label>
                        <input type="number" id="obstacleDensity" value="0.1" min="0" max="1" step="0.05">
                    </div>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="panel-section">
                <div class="section-title">任务控制</div>
                <div class="btn-row">
                    <button class="btn btn-start" id="btnStart" onclick="sendCommand('START')">▶ 开始</button>
                    <button class="btn btn-pause" id="btnPause" onclick="sendCommand('PAUSE')">⏸ 暂停</button>
                    <button class="btn btn-reset" id="btnReset" onclick="sendCommand('RESET')">↺ 重置</button>
                </div>

                <!-- 添加小车 -->
                <button class="btn btn-apply btn-full" id="btnAddCar" onclick="addCar()" style="margin-top:8px;background:linear-gradient(135deg,#7c3aed,#a78bfa)">
                    ➕ 添加小车
                </button>
            </div>

            <!-- 统计 -->
            <div class="panel-section">
                <div class="section-title">运行状态</div>

                <!-- 探索进度条 -->
                <div style="margin-bottom:10px">
                    <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                        <span style="font-size:11px;color:var(--text-muted);font-weight:600">探索率</span>
                        <span id="taskStatus" class="task-status-badge task-inactive">未激活</span>
                    </div>
                    <div class="explore-bar-wrap">
                        <div class="explore-bar-outer">
                            <div class="explore-bar-inner" id="exploreBar" style="width:0%"></div>
                        </div>
                        <span class="explore-value" id="exploreRate">0.00%</span>
                    </div>
                </div>

                <!-- 小车状态表 -->
                <table class="car-table" id="carTable">
                    <thead>
                        <tr>
                            <th>小车</th>
                            <th>状态</th>
                            <th>位置</th>
                            <th>步数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="carTableBody">
                        <tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:12px">等待数据...</td></tr>
                    </tbody>
                </table>

                <!-- 巡检完成 -->
                <div class="completed-badge" id="completedBadge">🎉 巡检完成！</div>
            </div>

            <!-- 图例 -->
            <div class="panel-section">
                <div class="section-title">图例</div>
                <div class="legend-inline">
                    <div class="legend-chip"><span class="legend-dot" style="background:#1a2436;color:#1a2436"></span>未探索</div>
                    <div class="legend-chip"><span class="legend-dot" style="background:#1e4d3a;color:#1e4d3a"></span>已探索</div>
                    <div class="legend-chip"><span class="legend-dot" style="background:#5c3d2e;color:#5c3d2e"></span>障碍物</div>
                    <div class="legend-chip"><span class="legend-dot" style="background:#2196F3;color:#2196F3"></span>空闲</div>
                    <div class="legend-chip"><span class="legend-dot" style="background:#8BC34A;color:#8BC34A"></span>移动中</div>
                    <div class="legend-chip"><span class="legend-dot" style="background:#F44336;color:#F44336"></span>阻塞</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ==================== 常量 ====================
    var WS_URL = 'ws://localhost:8887';
    var CELL_SIZE = 20;
    var CAR_STATUS_COLORS = {
        'IDLE': '#2196F3',
        'MOVING': '#8BC34A',
        'BLOCKED': '#F44336'
    };
    var CAR_STATUS_LABELS = {
        'IDLE': '空闲',
        'MOVING': '移动中',
        'BLOCKED': '阻塞'
    };
    var UNEXPLORED_COLOR = '#1a2436';
    var EXPLORED_COLOR = '#1e4d3a';
    var OBSTACLE_COLOR = '#5c3d2e';

    // ==================== 状态 ====================
    var ws = null;
    var currentState = null;
    var selectedCarId = null;

    // ==================== WebSocket ====================
    function connectWebSocket() {
        if (ws && ws.readyState === WebSocket.OPEN) return;

        ws = new WebSocket(WS_URL);

        ws.onopen = function() {
            console.log('WebSocket connected');
            var el = document.getElementById('connStatus');
            el.textContent = '已连接';
            el.className = 'connection-status connected';
        };

        ws.onclose = function() {
            console.log('WebSocket disconnected');
            var el = document.getElementById('connStatus');
            el.textContent = '未连接';
            el.className = 'connection-status disconnected';
            setTimeout(connectWebSocket, 3000);
        };

        ws.onerror = function(err) {
            console.error('WebSocket error:', err);
        };

        ws.onmessage = function(event) {
            try {
                var msg = JSON.parse(event.data);

                currentState = msg;
                render(msg);
            } catch (e) {
                console.error('Failed to process message:', e);
            }
        };
    }

    // ==================== Canvas 点击 ====================
    document.getElementById('gridCanvas').addEventListener('click', function(e) {
        if (!currentState) return;

        var canvas = document.getElementById('gridCanvas');
        var rect = canvas.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var my = e.clientY - rect.top;

        var mapView = currentState.mapView || [];
        var rows = mapView.length;
        var cols = rows > 0 ? mapView[0].length : 30;
        var actualCellSize = canvas.width / cols;

        var cars = currentState.cars || [];
        for (var i = 0; i < cars.length; i++) {
            var car = cars[i];
            if (!car.position) continue;
            var cx = car.position.x * actualCellSize + actualCellSize / 2;
            var cy = car.position.y * actualCellSize + actualCellSize / 2;
            var radius = Math.max(actualCellSize / 2 - 2, 4) + 4;
            var dx = mx - cx, dy = my - cy;
            if (dx * dx + dy * dy <= radius * radius) {
                selectedCarId = car.carId;
                if (currentState) render(currentState);
                return;
            }
        }

        // 取消选中
        selectedCarId = null;
        if (currentState) render(currentState);
    });

    // ==================== 渲染 ====================
    function render(state) {
        if (!state) return;

        var canvas = document.getElementById('gridCanvas');
        var ctx = canvas.getContext('2d');
        var mapView = state.mapView || [];
        var rows = mapView.length;
        var cols = rows > 0 ? mapView[0].length : 30;

        var cellSize = CELL_SIZE;
        if (cols > 40 || rows > 40) {
            cellSize = Math.floor(600 / Math.max(cols, rows));
        }

        var canvasW = cols * cellSize;
        var canvasH = rows * cellSize;
        canvas.width = canvasW;
        canvas.height = canvasH;

        ctx.clearRect(0, 0, canvasW, canvasH);

        // 障碍物集合
        var obstacles = {};
        (state.obstacles || []).forEach(function(p) {
            obstacles[p.x + ',' + p.y] = true;
        });

        // 网格
        for (var y = 0; y < rows; y++) {
            for (var x = 0; x < cols; x++) {
                var key = x + ',' + y;
                if (obstacles[key]) {
                    ctx.fillStyle = OBSTACLE_COLOR;
                } else if (mapView[y] && mapView[y][x]) {
                    ctx.fillStyle = EXPLORED_COLOR;
                } else {
                    ctx.fillStyle = UNEXPLORED_COLOR;
                }
                ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
            }
        }

        // 小车
        (state.cars || []).forEach(function(car) {
            if (!car.position) return;
            var cx = car.position.x * cellSize + cellSize / 2;
            var cy = car.position.y * cellSize + cellSize / 2;
            var radius = Math.max(cellSize / 2 - 2, 4);
            var color = CAR_STATUS_COLORS[car.status] || '#FFF';

            // 选中高亮环
            if (selectedCarId === car.carId) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius + 5, 0, 2 * Math.PI);
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 10;
                ctx.globalAlpha = 0.9;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1.0;
            }

            // 目标虚线
            if (car.target && car.target.x >= 0 && car.target.y >= 0) {
                var tx = car.target.x * cellSize + cellSize / 2;
                var ty = car.target.y * cellSize + cellSize / 2;
                ctx.beginPath();
                ctx.setLineDash([3, 3]);
                ctx.moveTo(cx, cy);
                ctx.lineTo(tx, ty);
                ctx.strokeStyle = color;
                ctx.globalAlpha = 0.4;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.globalAlpha = 1.0;

                ctx.beginPath();
                ctx.arc(tx, ty, 3, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.6;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            // 小车圆
            var grad = ctx.createRadialGradient(cx - radius * 0.3, cy - radius * 0.3, radius * 0.1, cx, cy, radius);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.4, color);
            grad.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 编号
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold ' + (cellSize * 0.5) + 'px ' + getComputedStyle(document.body).fontFamily;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(car.carId ? car.carId.slice(-1) : '?', cx, cy);
        });

        // 网格线
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 0.5;
        for (var gx = 0; gx <= cols; gx++) {
            ctx.beginPath(); ctx.moveTo(gx * cellSize, 0); ctx.lineTo(gx * cellSize, rows * cellSize); ctx.stroke();
        }
        for (var gy = 0; gy <= rows; gy++) {
            ctx.beginPath(); ctx.moveTo(0, gy * cellSize); ctx.lineTo(cols * cellSize, gy * cellSize); ctx.stroke();
        }

        // ---- 更新面板 ----

        // 探索率
        var ratePct = parseFloat(state.exploredRate * 100).toFixed(1);
        document.getElementById('exploreRate').textContent = ratePct + '%';
        document.getElementById('exploreBar').style.width = ratePct + '%';

        // 任务状态
        var statusEl = document.getElementById('taskStatus');
        if (state.taskActive) {
            statusEl.textContent = '运行中';
            statusEl.className = 'task-status-badge task-active';
        } else {
            statusEl.textContent = '未激活';
            statusEl.className = 'task-status-badge task-inactive';
        }

        // 所有小车状态表（增量更新，不重建 DOM，视觉平滑）
        var carList = state.cars || [];
        var tbody = document.getElementById('carTableBody');
        var existingRows = tbody.querySelectorAll('tr[data-car-id]');
        var existingMap = {};
        existingRows.forEach(function(r) { existingMap[r.getAttribute('data-car-id')] = r; });

        if (carList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:12px">等待数据...</td></tr>';
        } else {
            // 清除无数据的占位行
            var placeholder = tbody.querySelector('tr:not([data-car-id])');
            if (placeholder) placeholder.remove();

            var newCarIds = {};
            for (var ci = 0; ci < carList.length; ci++) {
                var c = carList[ci];
                newCarIds[c.carId] = true;
                var color = CAR_STATUS_COLORS[c.status] || '#999';
                var label = CAR_STATUS_LABELS[c.status] || c.status;
                var posStr = c.position ? '(' + c.position.x + ',' + c.position.y + ')' : '-';
                var selectedClass = (selectedCarId === c.carId) ? ' selected' : '';

                var row = existingMap[c.carId];
                if (!row) {
                    // 新小车 → 创建行
                    row = document.createElement('tr');
                    row.setAttribute('data-car-id', c.carId);
                    row.onclick = function(id) { return function() { selectCarFromTable(id); }; }(c.carId);
                    row.innerHTML = '<td class="car-name"></td>' +
                        '<td><span class="status-dot"></span><span class="status-label"></span></td>' +
                        '<td class="car-pos"></td>' +
                        '<td class="car-steps"></td>' +
                        '<td><button style="font-size:11px;padding:2px 8px;background:#b91c1c;color:white;border:none;border-radius:4px;cursor:pointer" onclick="event.stopPropagation();removeCar(\'' + c.carId + '\')">✕</button></td>';
                    tbody.appendChild(row);
                }

                // 增量更新行内容（仅改变化的部分）
                row.className = selectedClass;
                var cells = row.querySelectorAll('td');
                if (cells[0].textContent !== c.carId) cells[0].textContent = c.carId;
                var dot = cells[1].querySelector('.status-dot');
                if (dot.style.background !== color) { dot.style.background = color; dot.style.color = color; }
                var lbl = cells[1].querySelector('.status-label');
                if (lbl.textContent !== label) lbl.textContent = label;
                if (cells[2].textContent !== posStr) cells[2].textContent = posStr;
                var stepsStr = String(c.steps || 0);
                if (cells[3].textContent !== stepsStr) cells[3].textContent = stepsStr;
            }

            // 移除已不存在的小车行
            existingRows.forEach(function(r) {
                var id = r.getAttribute('data-car-id');
                if (!newCarIds[id]) r.remove();
            });
        }

        // 完成标记
        var badge = document.getElementById('completedBadge');
        badge.className = state.completed ? 'completed-badge show' : 'completed-badge';

        // 按钮状态
        document.getElementById('btnStart').disabled = state.taskActive;
        document.getElementById('btnPause').disabled = !state.taskActive;
    }

    function selectCarFromTable(carId) {
        selectedCarId = carId;
        if (currentState) render(currentState);
    }

    // ==================== 命令发送 ====================
    var _startDebounce = false;
    function sendCommand(type) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('WebSocket 未连接!');
            return;
        }

        if (type === 'START') {
            if (_startDebounce) { console.log('START debounced'); return; }
            _startDebounce = true;
            setTimeout(function() { _startDebounce = false; }, 2000);
        }

        var msg = { type: type };

        if (type === 'RESET') {
            msg.mapWidth = parseInt(document.getElementById('mapWidth').value) || 30;
            msg.mapHeight = parseInt(document.getElementById('mapHeight').value) || 30;
            msg.carCount = parseInt(document.getElementById('carCount').value) || 4;
            msg.obstacleDensity = parseFloat(document.getElementById('obstacleDensity').value) || 0.1;
            msg.routeAlgorithm = 'BFS';
        }

        ws.send(JSON.stringify(msg));
        console.log('Sent:', msg);
    }

    // ==================== 动态小车管理 ====================
    function addCar() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('WebSocket 未连接!');
            return;
        }
        // 生成下一个可用 carId
        var cars = (currentState && currentState.cars) || [];
        var used = {};
        cars.forEach(function(c) { used[c.carId] = true; });
        var nextId = 1;
        while (used['Car' + String(nextId).padStart(3, '0')]) nextId++;
        var carId = 'Car' + String(nextId).padStart(3, '0');

        // 随机生成位置（地图中心附近，避开边界）
        var mapW = (currentState && currentState.mapWidth) || 30;
        var mapH = (currentState && currentState.mapHeight) || 30;
        var x = Math.floor(mapW / 4) + Math.floor(Math.random() * mapW / 2);
        var y = Math.floor(mapH / 4) + Math.floor(Math.random() * mapH / 2);

        ws.send(JSON.stringify({ type: 'ADD_CAR', carId: carId, x: x, y: y }));
        console.log('Sent ADD_CAR:', carId, 'pos=(' + x + ',' + y + ')');
    }

    function removeCar(carId) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('WebSocket 未连接!');
            return;
        }
        if (!confirm('确认移除 ' + carId + '？')) return;
        ws.send(JSON.stringify({ type: 'REMOVE_CAR', carId: carId }));
        console.log('Sent REMOVE_CAR:', carId);
    }

    // ==================== 初始化 ====================
    connectWebSocket();

    var canvas = document.getElementById('gridCanvas');
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a1220';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#55657e';
    ctx.font = '15px Inter, Segoe UI, Microsoft YaHei, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('连接中...', 300, 300);
    </script>
</body>
