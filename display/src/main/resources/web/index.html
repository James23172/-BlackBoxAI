<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多机器人协作巡检仿真系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 24px; color: #e94560; margin-bottom: 8px; }
        .connection-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 10px;
            display: inline-block;
        }
        .connected { background: #4CAF50; color: white; }
        .disconnected { background: #F44336; color: white; }
        .main-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        #gridCanvas {
            border: 2px solid #444;
            background: #222;
            image-rendering: pixelated;
        }
        .control-panel {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            min-width: 280px;
            max-width: 320px;
        }
        .control-panel h3 {
            margin: 0 0 15px 0;
            color: #e94560;
            font-size: 18px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: block;
            margin-bottom: 4px;
            color: #aaa;
            font-size: 13px;
        }
        .control-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #0f3460;
            color: #eee;
            font-size: 14px;
        }
        .control-group input:focus {
            outline: none;
            border-color: #e94560;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            margin: 16px 0;
        }
        .btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: white;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:active { opacity: 0.7; }
        .btn-start { background: #4CAF50; }
        .btn-pause { background: #FF9800; }
        .btn-reset { background: #F44336; }
        .stats {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #333;
        }
        .stat {
            font-size: 14px;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
        }
        .stat-label { color: #aaa; }
        .stat-value { color: #e94560; font-weight: bold; }
        .legend {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #333;
        }
        .legend h4 { font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            border: 1px solid #555;
            flex-shrink: 0;
        }
        .completed-badge {
            display: none;
            text-align: center;
            margin-top: 12px;
            padding: 8px;
            background: #4CAF50;
            border-radius: 4px;
            font-weight: bold;
            color: white;
        }
        .completed-badge.show { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Multi-Robot Collaborative Inspection</h1>
        <span id="connStatus" class="connection-status disconnected">Disconnected</span>
    </div>

    <div class="main-container">
        <canvas id="gridCanvas" width="600" height="600"></canvas>

        <div class="control-panel">
            <h3>Control Panel</h3>

            <div class="control-group">
                <label>Map Width</label>
                <input type="number" id="mapWidth" value="30" min="10" max="80">
            </div>
            <div class="control-group">
                <label>Map Height</label>
                <input type="number" id="mapHeight" value="30" min="10" max="80">
            </div>
            <div class="control-group">
                <label>Car Count</label>
                <input type="number" id="carCount" value="1" min="1" max="4">
            </div>
            <div class="control-group">
                <label>Obstacle Density (0.0 ~ 1.0)</label>
                <input type="number" id="obstacleDensity" value="0.1" min="0" max="1" step="0.05">
            </div>

            <div class="btn-group">
                <button class="btn btn-start" id="btnStart" onclick="sendCommand('START')">Start</button>
                <button class="btn btn-pause" id="btnPause" onclick="sendCommand('PAUSE')">Pause</button>
                <button class="btn btn-reset" id="btnReset" onclick="sendCommand('RESET')">Reset</button>
            </div>

            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Exploration Rate</span>
                    <span class="stat-value" id="exploreRate">0.00%</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Task Status</span>
                    <span class="stat-value" id="taskStatus">Inactive</span>
                </div>
                <div class="stat" id="carStatusRow">
                    <span class="stat-label">Car Status</span>
                    <span class="stat-value" id="carStatus">-</span>
                </div>
                <div class="stat" id="carStepsRow">
                    <span class="stat-label">Car Steps</span>
                    <span class="stat-value" id="carSteps">0</span>
                </div>
                <div class="stat" id="carPosRow">
                    <span class="stat-label">Car Position</span>
                    <span class="stat-value" id="carPos">-</span>
                </div>
            </div>

            <div class="completed-badge" id="completedBadge">Inspection Complete!</div>

            <div class="legend">
                <h4>Legend</h4>
                <div class="legend-grid">
                    <div class="legend-item">
                        <div class="legend-color" style="background:#333;"></div>Unexplored
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background:#C8E6C9;"></div>Explored
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background:#5D4037;"></div>Obstacle
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background:#2196F3;"></div>IDLE
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background:#FF9800;"></div>WAITING
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background:#4CAF50;"></div>READY
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background:#8BC34A;"></div>MOVING
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background:#F44336;"></div>BLOCKED
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ==================== 常量 ====================
    var WS_URL = 'ws://localhost:8887';
    var CELL_SIZE = 20;
    var CAR_STATUS_COLORS = {
        'IDLE': '#2196F3',
        'WAITING_ROUTE': '#FF9800',
        'READY': '#4CAF50',
        'MOVING': '#8BC34A',
        'BLOCKED': '#F44336'
    };
    var UNEXPLORED_COLOR = '#333';
    var EXPLORED_COLOR = '#C8E6C9';
    var OBSTACLE_COLOR = '#5D4037';

    // ==================== 状态 ====================
    var ws = null;
    var currentState = null;

    // ==================== WebSocket ====================
    function connectWebSocket() {
        if (ws && ws.readyState === WebSocket.OPEN) return;

        ws = new WebSocket(WS_URL);

        ws.onopen = function() {
            console.log('WebSocket connected');
            var el = document.getElementById('connStatus');
            el.textContent = 'Connected';
            el.className = 'connection-status connected';
        };

        ws.onclose = function() {
            console.log('WebSocket disconnected');
            var el = document.getElementById('connStatus');
            el.textContent = 'Disconnected';
            el.className = 'connection-status disconnected';
            setTimeout(connectWebSocket, 3000);
        };

        ws.onerror = function(err) {
            console.error('WebSocket error:', err);
        };

        ws.onmessage = function(event) {
            try {
                var state = JSON.parse(event.data);
                currentState = state;
                render(state);
            } catch (e) {
                console.error('Failed to parse state:', e);
            }
        };
    }

    // ==================== 渲染 ====================
    function render(state) {
        var canvas = document.getElementById('gridCanvas');
        var ctx = canvas.getContext('2d');
        var mapView = state.mapView || [];
        var rows = mapView.length;
        var cols = rows > 0 ? mapView[0].length : 30;

        // 动态调整 cell size
        var cellSize = CELL_SIZE;
        if (cols > 40 || rows > 40) {
            cellSize = Math.floor(600 / Math.max(cols, rows));
        }

        // 调整 canvas 大小
        var canvasW = cols * cellSize;
        var canvasH = rows * cellSize;
        canvas.width = canvasW;
        canvas.height = canvasH;

        ctx.clearRect(0, 0, canvasW, canvasH);

        // 构建障碍物集合（O(1) 查找）
        var obstacles = {};
        (state.obstacles || []).forEach(function(p) {
            obstacles[p.x + ',' + p.y] = true;
        });

        // 渲染网格
        for (var y = 0; y < rows; y++) {
            for (var x = 0; x < cols; x++) {
                var key = x + ',' + y;
                if (obstacles[key]) {
                    ctx.fillStyle = OBSTACLE_COLOR;
                } else if (mapView[y] && mapView[y][x]) {
                    ctx.fillStyle = EXPLORED_COLOR;
                } else {
                    ctx.fillStyle = UNEXPLORED_COLOR;
                }
                ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
            }
        }

        // 渲染小车
        (state.cars || []).forEach(function(car) {
            if (car.position) {
                var cx = car.position.x * cellSize + cellSize / 2;
                var cy = car.position.y * cellSize + cellSize / 2;
                var radius = Math.max(cellSize / 2 - 2, 4);
                var color = CAR_STATUS_COLORS[car.status] || '#FFF';

                // 目标指示器
                if (car.target && car.target.x >= 0 && car.target.y >= 0) {
                    var tx = car.target.x * cellSize + cellSize / 2;
                    var ty = car.target.y * cellSize + cellSize / 2;
                    ctx.beginPath();
                    ctx.setLineDash([3, 3]);
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(tx, ty);
                    ctx.strokeStyle = color;
                    ctx.globalAlpha = 0.4;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.globalAlpha = 1.0;

                    // 目标点小圆
                    ctx.beginPath();
                    ctx.arc(tx, ty, 3, 0, 2 * Math.PI);
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.6;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }

                // 小车位置圆
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 小车编号
                ctx.fillStyle = '#FFF';
                ctx.font = (cellSize * 0.5) + 'px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(car.carId ? car.carId.slice(-1) : '1', cx, cy);
            }
        });

        // 渲染网格线
        ctx.strokeStyle = '#3a3a3a';
        ctx.lineWidth = 0.5;
        for (var gx = 0; gx <= cols; gx++) {
            ctx.beginPath();
            ctx.moveTo(gx * cellSize, 0);
            ctx.lineTo(gx * cellSize, rows * cellSize);
            ctx.stroke();
        }
        for (var gy = 0; gy <= rows; gy++) {
            ctx.beginPath();
            ctx.moveTo(0, gy * cellSize);
            ctx.lineTo(cols * cellSize, gy * cellSize);
            ctx.stroke();
        }

        // 更新统计信息
        var rate = (state.exploredRate * 100).toFixed(2);
        document.getElementById('exploreRate').textContent = rate + '%';
        document.getElementById('taskStatus').textContent = state.taskActive ? 'Active' : 'Inactive';

        var carList = state.cars || [];
        if (carList.length > 0) {
            var car = carList[0];
            document.getElementById('carStatus').textContent = car.status || '-';
            document.getElementById('carSteps').textContent = car.steps || 0;
            if (car.position) {
                document.getElementById('carPos').textContent = '(' + car.position.x + ', ' + car.position.y + ')';
            }
        }

        // 完成标记
        var badge = document.getElementById('completedBadge');
        if (state.completed) {
            badge.className = 'completed-badge show';
        } else {
            badge.className = 'completed-badge';
        }

        // 按钮状态
        document.getElementById('btnStart').disabled = state.taskActive;
        document.getElementById('btnPause').disabled = !state.taskActive;
    }

    // ==================== 命令发送 ====================
    function sendCommand(type) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('WebSocket not connected!');
            return;
        }

        var msg = { type: type };

        if (type === 'SET_CONFIG' || type === 'START' || type === 'RESET') {
            msg.mapWidth = parseInt(document.getElementById('mapWidth').value) || 30;
            msg.mapHeight = parseInt(document.getElementById('mapHeight').value) || 30;
            msg.carCount = parseInt(document.getElementById('carCount').value) || 1;
            msg.obstacleDensity = parseFloat(document.getElementById('obstacleDensity').value) || 0.1;
        }

        ws.send(JSON.stringify(msg));
        console.log('Sent:', msg);
    }

    // ==================== 初始化 ====================
    connectWebSocket();

    // 初始渲染空地图
    var canvas = document.getElementById('gridCanvas');
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#666';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Waiting for connection...', 300, 300);
    </script>
</body>
</html>
