<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>多机器人协同巡检仿真系统</title>
    <style>
        :root {
            --bg-root: #060b16; --bg-card: #0d1524; --bg-surface: #111b2e; --bg-input: #0a1222;
            --text: #edf2f9; --text2: #8b9cc0; --text3: #55657e;
            --accent: #38bdf8; --green: #34d399; --yellow: #f59e0b; --red: #f87171;
            --border: #1a2744; --radius: 12px; --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Inter','Segoe UI','Microsoft YaHei',system-ui,sans-serif;
            background:var(--bg-root);color:var(--text);min-height:100vh;
            padding:20px 24px 32px;line-height:1.5;
            background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(56,189,248,0.06),transparent);
        }

        /* ===== LOGIN PAGE ===== */
        .login-wrap{display:flex;justify-content:center;align-items:center;min-height:80vh}
        .login-box{background:var(--bg-card);border-radius:16px;padding:40px 36px;border:1px solid var(--border);box-shadow:var(--shadow);width:400px;max-width:100%}
        .login-box h2{text-align:center;margin-bottom:8px;font-size:22px}
        .login-box .sub{text-align:center;font-size:12px;color:var(--text3);margin-bottom:24px}
        .login-box .row{margin-bottom:14px}
        .login-box label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:600}
        .login-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);color:var(--text);font-size:14px;outline:none;transition:all .2s}
        .login-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
        .login-box .btn{width:100%;padding:12px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;color:#fff;transition:all .2s;margin-top:6px}
        .login-box .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
        .login-box .btn:disabled{opacity:.3;cursor:not-allowed}
        .btn-login{background:linear-gradient(135deg,#059669,#10b981)}
        .error-msg{text-align:center;margin-top:12px;font-size:12px;color:var(--red);min-height:18px;transition:all .3s}
        .login-tip{text-align:center;margin-top:12px;font-size:11px;color:var(--text3)}

        /* ===== MAIN APP ===== */
        .header{text-align:center;margin-bottom:20px}
        .header h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent)0%,#818cf8 45%,#c084fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
        .header .sub{font-size:12px;color:var(--text3);margin-bottom:10px}
        .badge{font-size:11px;font-weight:600;padding:5px 14px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}
        .badge::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
        .badge-ok{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.25)}
        .badge-err{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.25);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
        .user-bar{display:flex;justify-content:center;align-items:center;gap:16px;font-size:12px;color:var(--text2);margin-bottom:6px}
        .user-bar .logout{color:var(--red);cursor:pointer;background:none;border:none;font-size:12px}

        .main{display:flex;gap:20px;justify-content:center;align-items:flex-start;max-width:1400px;margin:0 auto}
        .canvas-card{background:var(--bg-card);border-radius:16px;border:1px solid var(--border);padding:16px;box-shadow:var(--shadow)}
        #gridCanvas{display:block;border-radius:8px;cursor:crosshair;max-width:100%}
        .panel{background:var(--bg-card);border-radius:16px;width:340px;flex-shrink:0;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
        .panel-section{padding:16px 18px}.panel-section+.panel-section{border-top:1px solid var(--border)}
        .section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .section-title::after{content:'';flex:1;height:1px;background:var(--border)}
        .form-row{display:flex;gap:10px;margin-bottom:10px}
        .form-field{flex:1;display:flex;flex-direction:column;gap:4px}
        .form-field label{color:var(--text2);font-size:11px;font-weight:600}
        .form-field input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);color:var(--text);font-size:13px;outline:none;transition:all .2s}
        .form-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.1)}
        .btn-row{display:flex;gap:8px}
        .btn{flex:1;padding:10px 6px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;color:#fff;letter-spacing:.3px;transition:all .2s}
        .btn:disabled{opacity:.3;cursor:not-allowed;filter:grayscale(40%)}
        .btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
        .btn-start{background:linear-gradient(135deg,#059669,#10b981)}
        .btn-pause{background:linear-gradient(135deg,#d97706,#f59e0b);color:#1a1a1a}
        .btn-reset{background:linear-gradient(135deg,#b91c1c,#ef4444)}
        .btn-full{flex:none;width:100%}
        .explore-bar-outer{flex:1;height:8px;border-radius:8px;background:var(--bg-input);overflow:hidden}
        .explore-bar-inner{height:100%;border-radius:8px;background:linear-gradient(90deg,#059669,#34d399);transition:width .5s}
        .explore-value{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--green);min-width:56px;text-align:right;transition:all .3s}
        .task-active{background:rgba(52,211,153,.12);color:var(--green);font-size:11px;padding:2px 10px;border-radius:10px}
        .task-inactive{background:rgba(248,113,113,.1);color:var(--red);font-size:11px;padding:2px 10px;border-radius:10px}
        .car-table{width:100%;border-collapse:collapse;font-size:11px}
        .car-table th{text-align:left;color:var(--text3);font-weight:600;font-size:10px;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--border)}
        .car-table td{padding:6px 2px;border-bottom:1px solid rgba(26,39,68,.5);color:var(--text2);transition:all .3s}
        .car-table .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;box-shadow:0 0 6px currentColor;transition:background .3s}
        .car-table tr{cursor:pointer}.car-table tr:hover{background:rgba(56,189,248,.04)}.car-table tr.selected{background:rgba(56,189,248,.06)}
        .car-steps{font-family:var(--font-mono);color:var(--accent);font-weight:600}
        .completed-badge{display:none;text-align:center;padding:12px;background:linear-gradient(135deg,#059669,#34d399);border-radius:8px;font-weight:700;color:#fff;margin-top:10px}
        .completed-badge.show{display:block;animation:pop .45s}
        @keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
        .legend-inline{display:flex;flex-wrap:wrap;gap:8px 12px}
        .legend-chip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
        .legend-dot{width:10px;height:10px;border-radius:3px}

        /* User management table */
        .user-table{width:100%;font-size:11px;border-collapse:collapse;margin-top:8px}
        .user-table td{padding:4px 6px;border-bottom:1px solid var(--border)}

        .hidden{display:none!important}
        @media(max-width:900px){.main{flex-direction:column;align-items:center}.panel{width:100%;max-width:440px}}

        /* Register section */
        .reg-row{display:flex;gap:8px;margin-bottom:8px}
        .reg-row input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text);font-size:12px;outline:none}
        .reg-row select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text);font-size:12px}
        .reg-row label{font-size:12px;color:var(--text2);white-space:nowrap;line-height:32px}
        .reg-msg{font-size:11px;min-height:16px;margin-top:4px}
    </style>
</head>
<body>

<!-- ==================== LOGIN PAGE ==================== -->
<div id="loginPage">
    <div class="login-wrap">
        <div class="login-box">
            <h2>🚗 多机器人协作巡检</h2>
            <div class="sub">请登录以使用系统</div>
            <div class="row"><label>用户名</label><input type="text" id="loginUser" placeholder="admin" autocomplete="username"></div>
            <div class="row"><label>密码</label><input type="password" id="loginPass" placeholder="admin123" autocomplete="current-password"></div>
            <button class="btn btn-login" id="loginBtn" onclick="doLogin()">登 录</button>
            <div class="error-msg" id="loginError"></div>
            <div class="login-tip">默认管理员：admin / admin123</div>
        </div>
    </div>
</div>

<!-- ==================== MAIN APP ==================== -->
<div id="mainApp" class="hidden">
    <div class="header">
        <h1 id="appTitle">多机器人协同巡检</h1>
        <div class="user-bar">
            <span>👤 <span id="userDisplay"></span>（<span id="roleLabel"></span>）</span>
            <button class="logout" onclick="doLogout()">退出登录</button>
        </div>
        <span id="connStatus" class="badge badge-err">未连接</span>
    </div>

    <!-- All role panels share the same canvas + panel, swapped dynamically -->
    <div class="main" id="mainLayout">
        <div class="canvas-card"><canvas id="gridCanvas" width="640" height="640"></canvas></div>
        <div class="panel" id="panelContent"></div>
    </div>
</div>

<script>
// ====================================================================
//  STATE
// ====================================================================
// SHA-256 纯 JS 实现（无外部依赖）
function sha256(str) {
    var r = function(n,b){return(n>>>b)|(n<<(32-b))};
    var C = function(q,n){var b=q>>>16,a=n>>>16;q&=0xffff;n&=0xffff;return ((b*a)<<16)+(q*n);};
    var S = function(n,b){return(n>>>b)|(n<<(32-b))};
    var K = [1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,
             3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,
             3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,
             2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,
             666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,
             2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,
             430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,
             1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
    var H = [1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225];
    var bytes = [];
    for (var i=0;i<str.length;i++){var c=str.charCodeAt(i);if(c<0x80)bytes.push(c);else if(c<0x800){bytes.push(0xc0|(c>>6),0x80|(c&0x3f));}else if(c<0xd800||c>=0xe000){bytes.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f));}else{i++;c=0x10000+(((c&0x3ff)<<10)|(str.charCodeAt(i)&0x3ff));bytes.push(0xf0|(c>>18),0x80|((c>>12)&0x3f),0x80|((c>>6)&0x3f),0x80|(c&0x3f));}}
    var bitLen = bytes.length*8;
    bytes.push(0x80);
    while(bytes.length%64!==56)bytes.push(0);
    for(var i=0;i<8;i++){bytes.push((bitLen>>>((7-i)*8))&0xff);}
    for(var chunkStart=0;chunkStart<bytes.length;chunkStart+=64){
        var w=[];for(var i=0;i<16;i++){w[i]=(bytes[chunkStart+i*4]<<24)|(bytes[chunkStart+i*4+1]<<16)|(bytes[chunkStart+i*4+2]<<8)|bytes[chunkStart+i*4+3];}
        for(var i=16;i<64;i++){var s0=(S(w[i-15],7)^S(w[i-15],18)^(w[i-15]>>>3)),s1=(S(w[i-2],17)^S(w[i-2],19)^(w[i-2]>>>10));w[i]=w[i-16]+s0+w[i-7]+s1;}
        var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
        for(var i=0;i<64;i++){var S1=(S(e,6)^S(e,11)^S(e,25)),ch=(e&f)^((~e)&g),t1=h+S1+ch+K[i]+w[i],S0=(S(a,2)^S(a,13)^S(a,22)),maj=(a&b)^(a&c)^(b&c),t2=S0+maj;h=g;g=f;f=e;e=d+t1;d=c;c=b;b=a;a=t1+t2;}
        H[0]=H[0]+a;H[1]=H[1]+b;H[2]=H[2]+c;H[3]=H[3]+d;H[4]=H[4]+e;H[5]=H[5]+f;H[6]=H[6]+g;H[7]=H[7]+h;
    }
    var hex='';
    for(var i=0;i<8;i++)hex+=((H[i]>>>0).toString(16).padStart(8,'0'));
    return hex;
}

var ws = null, currentState = null, selectedCarId = null;
var CAR_STATUS_COLORS = { 'IDLE': '#2196F3', 'MOVING': '#8BC34A', 'BLOCKED': '#F44336' };
var CAR_STATUS_LABELS = { 'IDLE': '空闲', 'MOVING': '移动中', 'BLOCKED': '阻塞' };
var CELL_SIZE = 16; // 40×40
var TICK_INTERVAL = 200;
var animFrameId = null, lastRenderTime = 0;
var carPositions = {}; // smooth interpolation
var targetPositions = {};

// ====================================================================
//  ROUTE GUARD
// ====================================================================
var authServer = 'http://localhost:8890';  // 默认值，可由 /api/config 覆盖
var MACHINE_ID = '主';                      // 默认值

async function loadConfig() {
    try {
        var r = await fetch('/api/config?_=' + Date.now());
        var cfg = await r.json();
        if (cfg.authServer) authServer = cfg.authServer;
        if (cfg.machine) MACHINE_ID = cfg.machine;
        if (cfg.version) checkVersion(cfg.version);
    } catch(e) { /* 保持默认值 localhost */ }
}

/**
 * 前端版本自愈：比对服务端下发的 index.html 内容哈希。
 * 版本不一致 → 自动带 cache-busting 参数刷新页面（最多 3 次防止死循环）。
 */
function checkVersion(serverVersion) {
    var stored = localStorage.getItem('appVersion');

    // 首次访问：记录版本并正常继续
    if (!stored) {
        localStorage.setItem('appVersion', serverVersion);
        return;
    }

    // 版本匹配
    if (stored === serverVersion) return;

    // 版本不匹配 → 安全阀检查
    var count = parseInt(sessionStorage.getItem('vrCount') || '0');
    if (count >= 3) {
        console.error('版本自动刷新已达上限，强制接受服务端版本。' +
            'server=' + serverVersion + ' stored=' + stored);
        sessionStorage.removeItem('vrCount');
        localStorage.setItem('appVersion', serverVersion);
        return;
    }

    sessionStorage.setItem('vrCount', String(count + 1));
    localStorage.setItem('appVersion', serverVersion);

    var newUrl = window.location.pathname + '?v=' + serverVersion;
    if (window.location.hash) newUrl += window.location.hash;
    window.location.replace(newUrl);
}

function getToken() { return localStorage.getItem('token'); }
function getRole()  { return localStorage.getItem('role'); }
function getUsername() { return localStorage.getItem('username'); }
function isLoggedIn() {
    var t = getToken(); if (!t) return false;
    try {
        var payload = JSON.parse(atob(t.split('.')[1] || 'e30='));
        if (payload.exp && Date.now() > payload.exp) { localStorage.clear(); return false; }
        return true;
    } catch(e) { return !!t; }
}

async function routeGuard() {
    await loadConfig();  // 确保先拿到 authServer 地址再渲染登录页
    var hash = location.hash || '#login';
    if (hash === '#login') { showLogin(); return; }
    if (!isLoggedIn()) { showLogin('会话已过期，请重新登录'); return; }
    var role = getRole();
    var valid = { '#configurator': 'configurator', '#operator': 'operator', '#analyst': 'analyst' };
    if (valid[hash] && valid[hash] === role) { showMain(role); return; }
    // Redirect to correct role page
    location.hash = '#' + role;
}

window.addEventListener('hashchange', routeGuard);

// ====================================================================
//  LOGIN
// ====================================================================
function showLogin(msg) {
    document.getElementById('loginPage').className = '';
    document.getElementById('mainApp').className = 'hidden';
    if (ws) { try{ws.close()}catch(e){} ws = null; }
    var el = document.getElementById('loginError');
    el.textContent = msg || '';
}

async function doLogin() {
    var u = document.getElementById('loginUser').value.trim() || 'admin';
    var p = document.getElementById('loginPass').value || 'admin123';
    var errEl = document.getElementById('loginError');
    var btn = document.getElementById('loginBtn');
    errEl.textContent = ''; btn.disabled = true; btn.textContent = '登录中...';

    try {
        var r = await fetch(authServer + '/api/auth/login', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({username: u, password: p})
        });
        var j = await r.json();
        if (j.success) {
            localStorage.setItem('token', j.token);
            localStorage.setItem('role', j.role);
            localStorage.setItem('username', j.username);
            location.hash = '#' + j.role;
        } else {
            errEl.textContent = j.error || '用户名或密码错误';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginUser').focus();
        }
    } catch(e) {
        errEl.textContent = '认证服务未启动 (' + authServer + ')';
    } finally {
        btn.disabled = false; btn.textContent = '登 录';
    }
}

// Allow Enter key to login
document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !document.getElementById('mainApp').className.includes('hidden') === false) {
        if (document.getElementById('loginPage').className === '') doLogin();
    }
});

function doLogout() {
    localStorage.clear();
    if (ws) { try{ws.close()}catch(e){} ws = null; }
    location.hash = '#login';
    showLogin();
}

// ====================================================================
//  MAIN APP ENTRY
// ====================================================================
function showMain(role) {
    document.getElementById('loginPage').className = 'hidden';
    document.getElementById('mainApp').className = '';
    document.getElementById('userDisplay').textContent = getUsername();
    var labels = {configurator:'配置员',operator:'运行员',analyst:'分析员'};
    document.getElementById('roleLabel').textContent = labels[role] || role;
    document.getElementById('appTitle').textContent = (labels[role]||role) + '面板';

    buildPanel(role);
    connectWebSocket();
}

function buildPanel(role) {
    var p = document.getElementById('panelContent');
    if (role === 'configurator') {
        p.innerHTML =
            section('地图配置',[
                row([f('地图宽度','mapWidth','40','number',10,80),f('地图高度','mapHeight','40','number',10,80)]),
                row([f('小车数量','carCount','4','number',1,20),f('障碍物密度','obstacleDensity','0.1','number',0,1,0.05)]),
                '<div style="font-size:10px;color:var(--text3);margin-bottom:6px">右键点击地图格子切换障碍物</div>'
            ]) +
            section('障碍物编辑',[
                '<button class="btn btn-full" onclick="ws.send(JSON.stringify({type:\'RANDOM_OBSTACLES\'}))" style="background:linear-gradient(135deg,#d97706,#f59e0b);color:#1a1a1a">🎲 随机生成障碍物</button>'
            ]) +
            section('任务控制',[
                '<div class="btn-row"><button class="btn btn-start" id="btnStart" onclick="sendCmd(\'START\', \'global\')">▶ 全局开始</button><button class="btn btn-pause" id="btnPause" onclick="sendCmd(\'PAUSE\', \'global\')">⏸ 全局暂停</button><button class="btn btn-reset" id="btnReset" onclick="sendCmd(\'RESET\', \'global\')">↺ 全局重置</button></div>',
                '<button class="btn btn-full" onclick="addCar()" style="margin-top:8px;background:linear-gradient(135deg,#7c3aed,#a78bfa)">➕ 添加小车</button>'
            ]) +
            section('运行状态',[
                '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:11px;color:var(--text3);font-weight:600">探索率</span><span id="taskStatus" class="task-inactive">未激活</span></div>',
                '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><div class="explore-bar-outer"><div class="explore-bar-inner" id="exploreBar" style="width:0%"></div></div><span class="explore-value" id="exploreRate">0.0%</span></div>',
                carTable(5),
                '<div class="completed-badge" id="completedBadge">🎉 巡检完成！</div>'
            ]) +
            section('用户管理',[
                '<div class="reg-row"><input type="text" id="regUser" placeholder="用户名"></div>',

// ====================================================================
//  CANVAS + OBSTACLE TOGGLE
// ====================================================================
function attachCanvasListeners(role) {
    var canvas = document.getElementById('gridCanvas');
    // Click car selection
    canvas.addEventListener('click', function(e){
        if (!currentState) return;
        var rect = canvas.getBoundingClientRect();
        var mx = e.clientX - rect.left, my = e.clientY - rect.top;
        var rows = (currentState.mapView||[]).length || 40, cols = rows > 0 ? (currentState.mapView[0]||[]).length : 40;
        var cs = canvas.width / cols;
        var cars = currentState.cars || [];
        for (var i = 0; i < cars.length; i++) {
            var car = cars[i]; if (!car.position) continue;
            var cx = car.position.x * cs + cs/2, cy = car.position.y * cs + cs/2;
            if ((mx-cx)*(mx-cx)+(my-cy)*(my-cy) <= (cs/2+4)*(cs/2+4)) { selectedCarId = car.carId; render(currentState); return; }
        }
        selectedCarId = null; render(currentState);
    });
    // Right-click obstacle toggle (configurator only)
    if (role === 'configurator') {
        canvas.addEventListener('contextmenu', function(e){
            e.preventDefault();
            if (!currentState) return;
            var rect = canvas.getBoundingClientRect();
            var mx = e.clientX - rect.left, my = e.clientY - rect.top;
            var rows = (currentState.mapView||[]).length || 40, cols = rows > 0 ? (currentState.mapView[0]||[]).length : 40;
            var cs = canvas.width / cols;
            var gx = Math.floor(mx/cs), gy = Math.floor(my/cs);
            if (gx>=0&&gx<cols&&gy>=0&&gy<rows) ws.send(JSON.stringify({type:'TOGGLE_OBSTACLE',x:gx,y:gy}));
        });
    }
}

// ====================================================================
//  WEBSOCKET
// ====================================================================
function connectWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.hostname + ':8887');
    ws.onopen = function(){
        var el = document.getElementById('connStatus');
        el.textContent = '已连接'; el.className = 'badge badge-ok';
        // 发送认证消息
        ws.send(JSON.stringify({type: 'AUTH', token: getToken()}));
    };
    ws.onclose = function(){
        var el = document.getElementById('connStatus');
        el.textContent = '未连接'; el.className = 'badge badge-err';
        setTimeout(connectWebSocket, 3000);
    };
    ws.onmessage = function(event){
        try {
            var msg = JSON.parse(event.data);
            if (msg.type === 'AUTH_OK') { MACHINE_ID = msg.machine; return; }
            if (!replayMode) {
                currentState = msg;
                render(msg);
            }
            updateLiveStats(msg);
        } catch(e) { console.error(e); }
    };
}

function sendCmd(type, scope) {
    if (!ws || ws.readyState !== WebSocket.OPEN) { alert('WebSocket未连接!'); return; }
    var msg = { type: type, scope: scope || 'global' };
    if (type === 'RESET') {
        msg.mapWidth = parseInt((document.getElementById('mapWidth')||{}).value) || 40;
        msg.mapHeight = parseInt((document.getElementById('mapHeight')||{}).value) || 40;
        msg.carCount = parseInt((document.getElementById('carCount')||{}).value) || 4;
        msg.obstacleDensity = parseFloat((document.getElementById('obstacleDensity')||{}).value) || 0.1;
    }
    ws.send(JSON.stringify(msg));
}

function addCar() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    var cars = (currentState&&currentState.cars)||[];
    var used = {}; cars.forEach(function(c){used[c.carId]=true});
    var n = 1; while(used['Car'+String(n).padStart(3,'0')]) n++;
    ws.send(JSON.stringify({type:'ADD_CAR', carId:'Car'+String(n).padStart(3,'0'), x:Math.floor(Math.random()*30)+5, y:Math.floor(Math.random()*30)+5}));
}
function addMyCar() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    var cars = (currentState&&currentState.cars)||[];
    var used = {}; cars.forEach(function(c){used[c.carId]=true});
    var n = 1; while(used['Car'+String(n).padStart(3,'0')]) n++;
    ws.send(JSON.stringify({type:'ADD_CAR', carId:'Car'+String(n).padStart(3,'0'),
        machine: MACHINE_ID, x: Math.floor(Math.random()*30)+5, y: Math.floor(Math.random()*30)+5}));
}
function removeCar(id) { if(confirm('确认移除 '+id+'?')) ws.send(JSON.stringify({type:'REMOVE_CAR',carId:id})); }

// ====================================================================
//  RENDER (Double-buffered canvas + incremental table)
// ====================================================================
var _colCache = {};
function getColor(cell, x, y, obstacles) {
    var k = x+','+y;
    if (obstacles[k]) return '#5c3d2e';
    if (cell) return '#1e4d3a';
    return '#1a2436';
}

function render(state) {
    if (!state) return;
    var ctx = document.getElementById('gridCanvas').getContext('2d');
    var mapView = state.mapView || [];
    var rows = mapView.length, cols = rows > 0 ? mapView[0].length : 40;
    var cellSize = Math.floor(640 / Math.max(cols, rows));
    var W = cols * cellSize, H = rows * cellSize;
    var canvas = document.getElementById('gridCanvas');
    canvas.width = W; canvas.height = H;

    // Double buffer
    var off = document.createElement('canvas'); off.width = W; off.height = H;
    var c = off.getContext('2d');

    var obs = {}; (state.obstacles||[]).forEach(function(p){obs[p.x+','+p.y]=true});

    // Grid cells
    for (var y = 0; y < rows; y++)
        for (var x = 0; x < cols; x++) {
            c.fillStyle = obs[x+','+y] ? '#5c3d2e' : (mapView[y]&&mapView[y][x] ? '#1e4d3a' : '#1a2436');
            c.fillRect(x*cellSize, y*cellSize, cellSize-1, cellSize-1);
        }

    // Cars
    (state.cars||[]).forEach(function(car){
        if (!car.position) return;
        var cx = car.position.x*cellSize+cellSize/2, cy = car.position.y*cellSize+cellSize/2;
        var r = Math.max(cellSize/2-2, 4);
        var color = CAR_STATUS_COLORS[car.status] || '#FFF';

        // Highlight ring
        if (selectedCarId === car.carId) {
            c.beginPath(); c.arc(cx,cy,r+5,0,2*Math.PI); c.strokeStyle='#f59e0b'; c.lineWidth=2.5;
            c.shadowColor='#f59e0b'; c.shadowBlur=10; c.globalAlpha=0.9; c.stroke(); c.shadowBlur=0; c.globalAlpha=1;
        }
        // Target
        if (car.target && car.target.x>=0 && car.target.y>=0) {
            var tx=car.target.x*cellSize+cellSize/2, ty=car.target.y*cellSize+cellSize/2;
            c.beginPath(); c.setLineDash([3,3]); c.moveTo(cx,cy); c.lineTo(tx,ty);
            c.strokeStyle=color; c.globalAlpha=0.4; c.lineWidth=1; c.stroke(); c.setLineDash([]); c.globalAlpha=1;
        }
        // Car circle
        var grad = c.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r);
        grad.addColorStop(0,'#fff'); grad.addColorStop(0.4,color); grad.addColorStop(1,'rgba(0,0,0,0.4)');
        c.beginPath(); c.arc(cx,cy,r,0,2*Math.PI); c.fillStyle=grad; c.fill();
        c.strokeStyle='rgba(255,255,255,0.5)'; c.lineWidth=1.5; c.stroke();
        // Label
        c.fillStyle='#FFF'; c.font='bold '+(cellSize*0.5)+'px sans-serif'; c.textAlign='center'; c.textBaseline='middle';
        c.fillText(car.carId?car.carId.slice(-1):'?', cx, cy);
    });

    // Grid lines
    c.strokeStyle='rgba(255,255,255,0.03)'; c.lineWidth=0.5;
    for (var gx=0;gx<=cols;gx++){c.beginPath();c.moveTo(gx*cellSize,0);c.lineTo(gx*cellSize,rows*cellSize);c.stroke()}
    for (var gy=0;gy<=rows;gy++){c.beginPath();c.moveTo(0,gy*cellSize);c.lineTo(cols*cellSize,gy*cellSize);c.stroke()}

    ctx.clearRect(0,0,W,H); ctx.drawImage(off,0,0);

    // Panel updates
    var rate = parseFloat(state.exploredRate*100).toFixed(1);
    var erEl = document.getElementById('exploreRate'); if(erEl){erEl.textContent=rate+'%'; document.getElementById('exploreBar').style.width=rate+'%'}
    var tsEl = document.getElementById('taskStatus'); if(tsEl){tsEl.textContent=state.taskActive?'运行中':'未激活'; tsEl.className=state.taskActive?'task-active':'task-inactive'}

    // Car table (incremental)
    var tbody = document.getElementById('carTableBody');
    if (tbody) {
        var carList = state.cars||[];
        if (getRole() === 'operator') {
            carList = carList.filter(function(c) {
                return c.owner === MACHINE_ID;
            });
        }
        var existing = {}; tbody.querySelectorAll('tr[data-car-id]').forEach(function(r){existing[r.getAttribute('data-car-id')]=r});
        var colCount = getRole() === 'configurator' ? 5 : 4;
        if (carList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="'+colCount+'" style="text-align:center;color:var(--text3);padding:12px">等待数据...</td></tr>';
        } else {
            var ph = tbody.querySelector('tr:not([data-car-id])'); if(ph) ph.remove();
            var newIds = {};
            carList.forEach(function(c){
                newIds[c.carId]=true;
                var color = CAR_STATUS_COLORS[c.status]||'#999';
                var label = CAR_STATUS_LABELS[c.status]||c.status;
                var posStr = c.position ? '('+c.position.x+','+c.position.y+')' : '-';
                var row = existing[c.carId];
                if (!row) {
                    row = document.createElement('tr'); row.setAttribute('data-car-id', c.carId);
                    row.onclick = function(id){return function(){selectCarFromTable(id)}}(c.carId);
                    row.innerHTML = '<td class="car-name"></td><td><span class="status-dot"></span><span class="status-label"></span></td><td class="car-pos"></td><td class="car-steps"></td>' +
                        (colCount===5?'<td><button style="font-size:11px;padding:2px 8px;background:#b91c1c;color:#fff;border:none;border-radius:4px;cursor:pointer" onclick="event.stopPropagation();removeCar(\''+c.carId+'\')">✕</button></td>':'');
                    tbody.appendChild(row);
                }
                row.className = selectedCarId===c.carId?'selected':'';
                var cells = row.querySelectorAll('td');
                if(cells[0].textContent!==c.carId) cells[0].textContent=c.carId;
                var dot=cells[1].querySelector('.status-dot'); if(dot.style.background!==color){dot.style.background=color;dot.style.color=color}
                var lbl=cells[1].querySelector('.status-label'); if(lbl.textContent!==label) lbl.textContent=label;
                if(cells[2].textContent!==posStr) cells[2].textContent=posStr;
                if(cells[3].textContent!==String(c.steps||0)) cells[3].textContent = c.steps||0;
            });
            Object.keys(existing).forEach(function(id){if(!newIds[id]) existing[id].remove()});
        }
    }

    var badge = document.getElementById('completedBadge'); if(badge) badge.className = state.completed ? 'completed-badge show' : 'completed-badge';
    var bs=document.getElementById('btnStart'), bp=document.getElementById('btnPause');
    if(bs) bs.disabled=state.taskActive; if(bp) bp.disabled=!state.taskActive;

    // 运行员模式下按钮状态
    var bms = document.getElementById('btnMyStart'), bmp = document.getElementById('btnMyPause');
    if (bms && bmp) {
        var globalPaused = state.globalPaused;
        bms.disabled = globalPaused;
        bmp.disabled = globalPaused;
        var banner = document.getElementById('globalPauseBanner');
        if (banner) {
            banner.style.display = globalPaused ? '' : 'none';
        }
    }

    // 全局暂停横幅（仅配置员可见）
    var pauseBanner = document.getElementById('globalPauseBanner');
    if (getRole() === 'configurator') {
        if (state.globalPaused) {
            if (!pauseBanner) {
                pauseBanner = document.createElement('div');
                pauseBanner.id = 'globalPauseBanner';
                pauseBanner.style.cssText = 'text-align:center;padding:8px;background:rgba(248,113,113,.12);color:var(--red);border-radius:8px;margin-bottom:10px;font-weight:700;font-size:13px';
                var panel = document.getElementById('panelContent');
                panel.insertBefore(pauseBanner, panel.firstChild);
            }
            pauseBanner.textContent = '⏸ 全局已暂停 — 所有运行员无法操作';
            pauseBanner.style.display = '';
        } else {
            if (pauseBanner) pauseBanner.style.display = 'none';
        }
    }
}

// ====================================================================
//  REGISTER (admin only)
// ====================================================================
async function doRegister() {
    var u = document.getElementById('regUser').value.trim();
    var p = document.getElementById('regPass').value;
    var role = document.getElementById('regRole').value;
    var m = document.getElementById('regMsg');
    if (!u || !p) { m.textContent = '用户名和密码不能为空'; m.style.color = 'var(--red)'; return; }
    if (u.length < 2 || p.length < 3) { m.textContent = '用户名至少2位，密码至少3位'; m.style.color = 'var(--red)'; return; }

    m.textContent = '创建中...'; m.style.color = 'var(--text3)';
    try {
        var r = await fetch(authServer + '/api/auth/register', {
            method:'POST',
            headers:{
                'Content-Type':'application/json',
                'Authorization':'Bearer '+getToken()
            },
            body: JSON.stringify({username: u, password: p, role: role})
        });
        var j = await r.json();
        if (j.success) { m.textContent = '用户 '+u+' 创建成功'; m.style.color = 'var(--green)';
            document.getElementById('regUser').value = ''; document.getElementById('regPass').value = '';
        } else { m.textContent = j.error || '注册失败'; m.style.color = 'var(--red)'; }
    } catch(e) { m.textContent = '认证服务未启动'; m.style.color = 'var(--red)'; }
}

function setReplayMode(on) {
    replayMode = on;
    document.getElementById('btnLiveMode').style.background = on ? 'var(--bg-input)' : 'var(--accent)';
    document.getElementById('btnLiveMode').style.color = on ? 'var(--text2)' : '#fff';
    document.getElementById('btnReplayMode').style.background = on ? 'var(--accent)' : 'var(--bg-input)';
    document.getElementById('btnReplayMode').style.color = on ? '#fff' : 'var(--text2)';
    if (on) {
        replayLoad();
        document.getElementById('replayInfo').style.display = '';
        document.getElementById('replaySlider').style.display = '';
    } else {
        if (replayPlaying) replayToggle();
        document.getElementById('replayInfo').style.display = 'none';
        document.getElementById('replaySlider').style.display = 'none';
        if (currentState) render(currentState);
    }
}

async function replayLoad() {
    try {
        var r = await fetch('http://localhost:8893/api/replay/list');
        var indices = await r.json();
        if (indices.length === 0) {
            document.getElementById('replayInfo').textContent = '无快照数据';
            return;
        }
        var br = await fetch('http://localhost:8893/api/replay/snapshots?from=0&to=' + (indices.length - 1));
        replaySnapshots = await br.json();
        replayMaxTick = replaySnapshots.length;
        document.getElementById('replayRange').textContent = replayMaxTick - 1;
        document.getElementById('replaySlider').max = replayMaxTick - 1;
        replayExploredRates = replaySnapshots.map(function(s){return s.exploredRate||0});
        drawExploredChart();
        document.getElementById('replayInfo').textContent = '共 ' + replayMaxTick + ' 帧快照';
    } catch(e) { document.getElementById('replayInfo').textContent = '回放服务未启动 (localhost:8893)'; }
}

function replayToggle() {
    var btn = document.getElementById('replayPlayBtn');
    if (replayPlaying) {
        clearInterval(replayTimer); replayPlaying = false; btn.textContent = '▶'; return;
    }
    if (replaySnapshots.length === 0) { replayLoad(); return; }
    replayPlaying = true; btn.textContent = '⏸';
    replayTimer = setInterval(function(){
        if (replayIdx >= replaySnapshots.length - 1) { clearInterval(replayTimer); replayPlaying = false; btn.textContent = '▶'; return; }
        replayIdx++; replayRender(replayIdx);
    }, 500 / replaySpeed);
}

function replayStep(delta) {
    if (replaySnapshots.length === 0) return;
    replayIdx = Math.max(0, Math.min(replaySnapshots.length - 1, replayIdx + delta));
    replayRender(replayIdx);
}

function replaySeek(val) {
    replayIdx = parseInt(val);
    if (replaySnapshots.length > 0) replayRender(replayIdx);
}

function replayRender(idx) {
    document.getElementById('replayCurrent').textContent = idx;
    document.getElementById('replaySlider').value = idx;
    // 将 snapshot JSON 转为兼容 render() 的格式
    var snap = replaySnapshots[idx];
    if (snap.mapBits) {
        snap.mapView = [];
        for (var y = 0; y < (snap.mapHeight||40); y++) {
            var row = [];
            for (var x = 0; x < (snap.mapWidth||40); x++) {
                row.push(snap.mapBits[y*snap.mapWidth + x] === '1');
            }
            snap.mapView.push(row);
        }
    }
    render(snap);
}

function replaySpeedChange() {
    replaySpeed = parseFloat(document.getElementById('replaySpeed').value);
    if (replayPlaying) { replayToggle(); replayToggle(); }
}

function updateLiveStats(state) {
    if (!state) return;
    var ts = (state.cars||[]).reduce(function(s,c){return s+(c.steps||0)},0);
    var el = document.getElementById('statSteps'); if (el) el.textContent = ts;
    el = document.getElementById('statExplored'); if (el) el.textContent = ((state.exploredRate||0)*100).toFixed(1)+'%';
    var tbody = document.getElementById('perCarStats');
    if (tbody && state.cars) {
        var rows = '';
        state.cars.forEach(function(c){
            rows += '<tr><td>'+c.carId+'</td><td class="car-steps">'+(c.steps||0)+'</td></tr>';
        });
        tbody.innerHTML = rows || '<tr><td colspan="2" style="color:var(--text3)">—</td></tr>';
    }
}

function drawExploredChart() {
    var canvas = document.getElementById('chartCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var data = replayExploredRates;
    ctx.fillStyle = '#0d1524'; ctx.fillRect(0, 0, W, H);
    if (!data || data.length === 0) return;
    var pad = {left: 36, right: 8, top: 8, bottom: 22};
    var pw = W - pad.left - pad.right, ph = H - pad.top - pad.bottom;

    ctx.strokeStyle = '#1a2744'; ctx.lineWidth = 0.5;
    for (var pct = 0; pct <= 100; pct += 25) {
        var y = pad.top + ph * (1 - pct / 100);
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
        ctx.fillStyle = '#55657e'; ctx.font = '8px sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(pct + '%', pad.left - 3, y + 3);
    }

    ctx.beginPath(); ctx.strokeStyle = '#34d399'; ctx.lineWidth = 1.2;
    for (var i = 0; i < data.length; i++) {
        var x = pad.left + pw * (i / (data.length - 1));
        var y = pad.top + ph * (1 - data[i]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
}
